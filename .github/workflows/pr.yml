name: PR Gate

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        # --rerun：本仓十几个"结构守卫"是运行时自己读源码文件的（File().readLines()），
        # 而被扫文件**不是** Test 任务的声明输入（只有 testClassesDirs/classpath 是）。
        # setup-gradle 默认开着构建缓存，于是这些任务可能 FROM-CACHE / UP-TO-DATE 被跳过，
        # 表现为"PR 门全绿但守卫根本没跑"（只有改动不进字节码时才会命中：改注释、
        # 把文件挪到拼错的同包名目录等 —— 正是守卫最该拦的那类）。
        # 测试门禁本来就该每次真跑，这里不为省几十秒留这个洞。
        run: ./gradlew :infra:player:testDebugUnitTest :core:rank:testDebugUnitTest :feature:video:testDebugUnitTest :app:testDebugUnitTest --rerun --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
