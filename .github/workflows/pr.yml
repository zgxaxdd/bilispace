name: PR Gate

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release (R8 / 混淆 / lintVital 校验)
        # T-3（2026-10-04 审查报告）：此前 release 只在 `push: tags v*` 或手动 dispatch 时构建，
        # 于是 `app/proguard-rules.pro` 里的 keep 规则（Protobuf-lite / OkHttp / Oplus 无缝动画）
        # 出错时 `assembleDebug` 全绿、只有打 tag 才炸。
        # 无签名凭据时 `app/build.gradle.kts` 会跳过签名，所以 PR 不需要 secrets。
        # 顺带覆盖 lintVital（release 的 fatal 级 lint 检查，含资源/API 级别问题）。
        run: ./gradlew :app:assembleRelease -PversionName=ci -PversionCode=1 --stacktrace

      - name: Unit tests (all modules)
        # T-3：上面那段"结构守卫清单"是按"是否扫源码"挑的，**纯行为型**模块的回归
        # 因此完全不在门禁里（core:swipe 的 21 个策略测试、core:model、infra:network-http、
        # core:download、infra:crypto 等）。这里用一次调用把**全部模块**的单元测试跑掉：
        # `testDebugUnitTest` 会在所有含该任务的子项目上执行（实测 51 个），
        # `--continue` 让"一个模块红"不掩盖其它模块的结果。
        run: ./gradlew testDebugUnitTest --continue --console=plain --stacktrace

      - name: Unit tests
        # ── 为什么不能写成「一条命令 + --rerun」（2026-10-03 实测，NX-11）────────────
        # `--rerun` 是**任务选项**，多任务命令行下它只作用于**命令行的最后一个任务**，
        # 其余任务照常判 UP-TO-DATE / FROM-CACHE 并静默跳过（FINDINGS W22 复核：仍成立，
        # 且比原结论更精确 —— 不是"被丢掉"，是"只给最后一个"）。
        # 实测：`A B --rerun` → A 跳过、B 执行；`B A --rerun` → B 跳过、A 执行。
        # 旧写法 `A B C D --rerun` 里真正复跑的只有 D=:app，A/B/C 的守卫形同虚设。
        # ── 为什么需要 --rerun ─────────────────────────────────────────────────
        # 本仓的"结构守卫"在运行时自己读源码文件（File().readLines()），而被扫文件
        # **不是** Test 任务的声明输入（只有 testClassesDirs/classpath 是）。
        # setup-gradle 默认开构建缓存，于是这些任务可能被跳过，表现为"PR 门全绿但守卫
        # 根本没跑"（只有改动不进字节码时才命中：改注释、把文件挪到拼错的同包名目录等
        # —— 正是守卫最该拦的那类）。
        # ── 本步骤做两件事 ────────────────────────────────────────────────────
        # 1. 逐模块**单任务**调用（--rerun 才会生效）；
        # 2. **自己校验任务真的执行了**：日志里必须是裸 `> Task :x:testDebugUnitTest`，
        #    出现 UP-TO-DATE / FROM-CACHE / SKIPPED 就判失败。只靠注释约束不住未来，
        #    这一条让 W22 那类行为变化**当场暴露**，而不是等守卫漏过一次真实回归。
        # 代价：每模块一次 Gradle 调用（多花几次配置时间）；不改为 --rerun-tasks
        # （那会连编译一起重跑，PR 时长暴涨）。
        #
        # 模块清单的取舍口径 = **含"扫源码型守卫"的模块**（判据：
        # `grep -rl -E "settings\.gradle\.kts|walkTopDown\(\)" <module>/src/test`）。
        # 旧清单漏了 `:core:designsystem` —— 而它正是 PT 批次红了 5 条的模块。
        # 纯行为型测试的模块（core:comment / feature:rank / infra:network-http 等，
        # 实测 0 个扫源码文件）不进清单，避免白付 PR 时长。
        run: |
          set -euo pipefail
          MODULES=(
            ":app"
            ":core:designsystem"
            ":core:feed"
            ":core:playback"
            ":core:settings"
            ":core:common"
            ":feature:settings"
            ":feature:video"
            ":infra:coldstart"
            ":infra:player"
            ":core:rank"
          )
          for m in "${MODULES[@]}"; do
            log="/tmp/test${m//:/_}.log"
            echo "::group::Unit tests $m"
            ./gradlew "$m:testDebugUnitTest" --rerun --console=plain --stacktrace 2>&1 | tee "$log"
            echo "::endgroup::"
            # 反向守卫：本任务这一轮必须**真的执行**，否则这次门禁等于没跑。
            if grep -qE "^> Task ${m}:testDebugUnitTest( UP-TO-DATE| FROM-CACHE| SKIPPED| NO-SOURCE)" "$log"; then
              echo "::error::$m:testDebugUnitTest 本轮被跳过（UP-TO-DATE/FROM-CACHE/SKIPPED）—— --rerun 没有生效，守卫等于没跑。"
              exit 1
            fi
            if ! grep -qE "^> Task ${m}:testDebugUnitTest$" "$log"; then
              echo "::error::日志里找不到 $m:testDebugUnitTest 的执行行，无法确认它跑过。"
              exit 1
            fi
          done

      - name: Custom lint rules (A2)
        # ── 为什么必须有这一步（2026-10-14，第 14 轮自我纠正）──────────────────────
        # A2 把 4 条「扫源码型」守卫迁成了 Lint 检测器（ci-lint/，见执行报告 §1.10~§1.14）。
        # 但迁完才发现：**这些检测器在 CI 里从来没有真正生效过。**
        #
        # `:app:assembleRelease` 里跑的 `lintVitalRelease` 只检查 **fatal** 级，
        # 而我们 6 条规则都是 `Severity.ERROR` —— ERROR 不是 FATAL，
        # lintVital 直接跳过。`lintDebug` 又不在任何 workflow 里。
        # 于是"把守卫换成 Lint"这一步的实际效果是：**守卫消失了，而没有替代品**。
        #
        # 这正是 A2 想消灭的那类失败（"报告干净，但一条规则都没生效"）——
        # 我把自己绕进去了。修法就是在 CI 里显式跑 `lintDebug`。
        #
        # 为什么是 `lintDebug` 而不是 `lintVitalRelease`：
        # 后者只覆盖 `:app` 且只看 fatal；前者覆盖每个模块的**全部** ERROR 级
        # （含 Jetpack Compose 自带的那套，本仓已知有若干历史 ERROR 需要另行处置，
        #  所以这里先只对 ci-lint 自有规则做判定 —— 见下一步）。
        run: chmod +x gradlew

      - name: Custom lint rules must actually run and must find nothing new
        # 反向守卫（与上面 testDebugUnitTest 那两步同一思路）：
        # ① 每个模块的 lintDebug 必须**真的执行到 lint 分析**，不能是 UP-TO-DATE；
        # ② 报告里不得出现任何 `Bbspace*` 规则命中 —— 存量已在各模块 lint.xml 里
        #    逐处豁免，出现即表示有人新写了违规、或漏登了基线。
        run: |
          set -euo pipefail
          MODULES=(
            ":app"
            ":core:designsystem"
            ":feature:home"
            ":feature:video"
            ":feature:dynamic"
            ":feature:rank"
          )
          fail=0
          for m in "${MODULES[@]}"; do
            log="/tmp/lint${m//:/_}.log"
            echo "::group::lintDebug $m"
            # lintDebug 在"发现 ERROR"时会非零退出 —— 那正是我们想要的信号，
            # 所以这里不能用 set -e 直接中断，先收下退出码再判。
            ./gradlew "$m:lintDebug" --console=plain 2>&1 | tee "$log" || true
            echo "::endgroup::"
            # ① 真的跑了？（与 testDebugUnitTest 那步同样的坑：缓存会让它静默跳过）
            if grep -qE "^> Task ${m}:lintDebug( UP-TO-DATE| FROM-CACHE| SKIPPED| NO-SOURCE)" "$log"; then
              echo "::error::$m:lintDebug 本轮被跳过（UP-TO-DATE/FROM-CACHE/SKIPPED）—— 自定义规则等于没跑。"
              fail=1
            fi
            # ② 自有规则零命中？
            report="${m#:}"; report="${report//://}/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ] && grep -q "from com.naaammme.bbspace.lint" "$report"; then
              echo "::error::$m: 自有 Lint 规则有命中 —— 新增违规请改代码；确属存量请在该模块 lint.xml 里登记并写明理由。"
              grep -E "Error: .*\[Bbspace" "$report" | head -20
              fail=1
            fi
          done
          exit $fail

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
