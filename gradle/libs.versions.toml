[versions]
# AGP 9.4.0：本项目 compileSdk 用到 37.2，而 AGP 9.3.1 只测到 37.1 会告警；9.4 正式支持 API 37。
#
# 2026-10-13（A4，上游 v0.3.6 同步）：haze 由 `2.0.0-beta03` 升到 `2.0.1`（stable）。
# 已用 `javap` 逐签名核对两版的 classes.jar，**调用点零改动**：
#   - `hazeBlur(Modifier, HazeInput, HazeBlurStyle, HazePerformanceMode, boolean)` JVM 描述符相同；
#   - `HazeBlurStyleScope` 的 10 个成员、`HazeState` / `hazeSource` / `HazeInput.Sources` /
#     `HazeColorEffect.Companion.tint` / `HazePerformanceMode.{Quality,Balanced,Performance,Fixed}`
#     两版皆存在且签名一致；`HazeInputScale` 两版皆不存在；
#   - 2.0.1 移除的 `HazeInputUpdateCadence` / `UnsetUpdateKey` / `BlurInputScalePolicy` /
#     `BlurAdaptiveUpdateKey` 在本仓 main **grep 0 命中**。
# 顺带收益：2.0.1 的 `minCompileMinorSdk` 由 2 降到 0 ⇒ 上一条注释里"haze 要求
# minCompileMinorSdk=2"这个**升级 AGP 的理由已经不再由 haze 提供**（AGP 9.4 仍是我们
# 主动选的，理由只剩"正式支持 API 37"）。
agp = "9.4.0"
coreKtx = "1.15.0"
junit = "4.13.2"
# 仅供 JVM 单测：Android 的 `org.json` 在 JVM 上是未实现的桩（调用即抛 RuntimeException）。
# 用官方实现让"解出来的 JSON 内容对不对"也能断言。20240303 与 android-37 语义一致。
orgJson = "20240303"
haze = "2.0.1"
# 液态玻璃背板（BiliPai 真实现路线）：miuix-blur 的 drawBackdrop/layerBackdrop
miuixBlur = "0.9.4-rc01"
# Miuix 控件渲染层（BiliPai 同款版本，`origin/main:gradle/libs.versions.toml:14`）。
# 与上面的 miuixBlur **刻意分开**：玻璃链路是上一轮真机验过的 rc01，本轮只新增
# 控件族（ui / icons / squircle），不动玻璃那一套的解析结果。
miuix = "0.9.4-5c91d5e5-SNAPSHOT"
# HCT 配色体系（上游 BiliPai `core/theme` 引入的 MaterialKolor，包装 Material Color Utilities）。
# Step 2 依赖实探专用：确认离线缓存可解析；业务接线要等 Lead 单独授权写域。
materialKolor = "4.1.1"
metricsPerformance = "1.0.0-beta04"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
# Kotlin 停在 2.3.20：KSP 与 Kotlin 编译器版本强耦合，本地可用的最新 KSP 是
# 2.3.12（对应 Kotlin 2.3.x）。升到 2.4.x 需要 KSP 2.4.x，当前不可得。
kotlin = "2.3.20"
composeBom = "2026.08.00"

# Dependency Injection
hilt = "2.60.1"
hiltNavigationCompose = "1.2.0"

# Networking
okhttp = "5.5.0"
kotlinxSerializationJson = "1.7.3"

# Protobuf
protobuf = "4.29.2"
protobufPlugin = "0.10.0"

# Database & Storage
room = "2.8.4"
datastore = "1.1.1"

# Navigation
navigation = "2.10.1"

# Adaptive
# 1.2.0 → 1.3.0：`currentWindowAdaptiveInfo()` 在 1.3.0 被弃用并要求改用
# `currentWindowAdaptiveInfoV2()`。旧版首次调用会注册折叠屏特性监听
# （RawFoldingFeatureProducer → ContentResolver.registerContentObserver），
# 实测在组合期触发一次 ~181ms 的 Binder 往返（StrictMode DiskReadViolation）。
m3Adaptive = "1.3.0"
windowManager = "1.3.0"

# Image Loading
coil = "3.6.2"

# 封面代表色提取（BiliPai 上游「卡片动态取色」同款）：androidx.palette 聚类取面积最大色
palette = "1.0.0"

# Video Player
media3 = "1.11.0"

# Coroutines
coroutines = "1.10.1"

# QR Code
zxing = "3.5.3"

# Build Tools
ksp = "2.3.12"

googleMaterial = "1.12.0"
danmakuFlameMaster = "1.0.6"

# OPPO system capability SDKs (compileOnly; implementation provided by ColorOS at runtime)
oplusViewSeamless = "1.0.0"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version = "1.4.1" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
haze-blur-materials = { group = "dev.chrisbanes.haze", name = "haze-blur-materials", version.ref = "haze" }
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuixBlur" }
# Miuix 控件族（group/name 与上游逐字对齐，见 `origin/main:gradle/libs.versions.toml:33-38`）
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
miuix-squircle = { group = "top.yukonga.miuix.kmp", name = "miuix-squircle-android", version.ref = "miuix" }
materialKolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metricsPerformance" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }

# Compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
